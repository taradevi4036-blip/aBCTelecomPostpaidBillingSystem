services:
  postgres:
    image: postgres:15-alpine
    container_name: abc_telecom_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: abc_telecom_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abc_telecom_app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/abc_telecom_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: MySecretKeyForJWTTokenGenerationAndValidationPurposeOnly123456789
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telecom_network

volumes:
  postgres_data:

networks:
  telecom_network:
